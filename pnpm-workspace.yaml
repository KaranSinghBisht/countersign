# pnpm 11 requires an explicit decision for every dependency that wants to run
# an install script, and fails the install until one is recorded. That is the
# right default — a postinstall script is arbitrary code execution at
# dependency-resolution time — so the answer is written down here rather than
# suppressed.
#
# esbuild (via vitest and tsx): allowed. Its postinstall only resolves and
# links the prebuilt platform binary already shipped in @esbuild/<platform>.
# Denying it leaves the binary unlinked on some platforms.
allowBuilds:
  esbuild: true

# `pnpm exec` otherwise re-runs a dependency check before every invocation,
# which turns each `make test` into a second install resolution.
verifyDepsBeforeRun: false
